version: "v0.4"

project:
  name: "Hilbert and UMD constants: Theorem 1.1"
  description: >-
    Theorem 1.1 of Lorist and van Neerven: real and complex Banach spaces
    X_n and Y_n of dimension 2^n separate the Hilbert transform and UMD
    constants at p = 2. Their growth rates are n and square root of n,
    with common positive comparison constants for all n at least one.
  authors:
    - "Emiel Lorist"
    - "Jan van Neerven"
  responsible_maintainers:
    - "Emiel Lorist"
  license: "Apache-2.0"
  license_notes: >-
    Apache-2.0 covers code and repository support files. The bundled paper,
    README and docs prose use CC-BY-4.0 under paper/LICENSE; prose code examples
    are also available under Apache-2.0. Third-party licenses remain applicable.

classification:
  arxiv: ["math.FA"]
  msc2020: ["46B20", "42A50", "46B09", "60G46"]

sources:
  - title: 'The bounds $\hbar_{p,X}\lesssim(\beta_{p,X})^2$ and $\beta_{p,X}\lesssim(\hbar_{p,X})^2$ are sharp'
    authors:
      - "Emiel Lorist"
      - "Jan van Neerven"
    id: "arXiv:2609.10444v1"
    location: "https://arxiv.org/abs/2609.10444v1"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Theorem 1.1, using the constructions and definitions of Sections 1.1
      and 2.1. The bundled manuscript is paper/Hilbert-and-UMD-arxiv-v1.pdf,
      licensed CC-BY-4.0. The arXiv copy has its own non-exclusive distribution
      license and is not asserted to be byte-identical.

related_formalizations: []

status:
  scope: >-
    Theorem 1.1 only: dimensions and all eight p = 2 inequalities over both
    scalar fields, with common positive universal constants. UMD uses all
    sigma-finite sample spaces and filtrations in any selected universe and
    all unimodular coefficients. The Hilbert constant uses compactly supported
    C1 tests and principal-value normalization 1/pi. Remark 1.2's precise
    coefficients, Corollary 1.3 and the general quadratic comparisons are
    outside the certification target.
  # Counts cover the proof development, excluding Challenge's deliberate theorem hole.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      models: ["GPT-6 Astra"]
      framework: "Codex"
      tool_setup: >-
        The entire repository was LLM-generated under human direction,
        including proofs, documentation, scripts, tests and configuration.
        Lean compilation, dependency audits and kernel replay verify the proofs.

fidelity:
  divergences: >-
    Internal bounds use n+1, with a proved conversion to the paper's n.
    The quantitative companion differs from Remark 1.2: square-root upper
    coefficients are 285, 448 and 57 rather than 176, 351 and 40; some lower
    coefficients also differ. Square-root lower bounds use direct witnesses
    instead of quadratic comparisons. See docs/PAPER-ALIGNMENT.md for the table.

review:
  status: "self-assessed"
  notes: >-
    Automated statement, definition, axiom and kernel checks; correspondence
    documented in docs/PAPER-ALIGNMENT.md. No independent human review claimed.

alignment:
  namespace: "HilbertUMD"
  statements:
    - source: "arXiv:2609.10444v1, Theorem 1.1"
      lean: "HilbertUMD.Comparison.theorem_1_1"
      module: "Solution"
      status: "proved"
      note: >-
        Challenge states the result using only Mathlib imports. Solution proves
        it via HilbertUMD.theorem_1_1; Comparator checks the two declarations.
